[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LCMS_sim"
version = "0.1.0"
description = "This project simulates a bottom-up proteomics workflow, covering the main steps from protein digestion to liquid chromatography (LC) and mass spectrometry (MS1/MS2)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valentina Arrea Soto", email = "valentina.arrea_soto@stud.uni-heidelberg.de }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pytest",
    "pandas",
    "matplotlib",
    "pyteomics",
    "ipykernel"
]

[tool.setuptools.packages.find]
include = ["LCMS_sim*"]
